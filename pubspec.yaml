name: split_sheet
description: Split Sheet - sign, timestamp and verify music ownership splits from the studio.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  go_router: ^14.2.0
  provider: ^6.1.2
  crypto: ^3.0.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  file_picker: ^8.1.2
  pdf: ^3.11.1
  printing: ^5.13.1
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
